<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FamilyFinance</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .muted {
      color: var(--muted);
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: #ffffff;
      padding: 18px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text);
      margin-bottom: 6px;
    }

    .nav-btn:hover {
      background: #eef2ff;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
    }

    .main {
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat {
      padding: 16px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat .value {
      font-size: 26px;
      font-weight: 800;
    }

    .section {
      margin-top: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-weight: 700;
    }

    .btn.secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn.small {
      padding: 6px 10px;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .error {
      color: var(--danger);
      font-size: 14px;
      margin-top: 10px;
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #e2e8f0;
    }

    .pill.success {
      background: #dcfce7;
      color: #166534;
    }

    .pill.warning {
      background: #fef3c7;
      color: #92400e;
    }

    .pill.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .right {
      text-align: right;
    }

    @media (max-width: 900px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .grid.cols-4,
      .grid.cols-2,
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="loginView" class="auth-wrap">
    <div class="card auth-card">
      <h1>FamilyFinance</h1>
      <p class="muted">Sign in to manage your family budget.</p>

      <form id="loginForm">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" autocomplete="username" required />

        <label for="loginPassword" style="margin-top: 12px;">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required />

        <div style="margin-top: 16px;">
          <button class="btn" type="submit">Sign In</button>
        </div>

        <div id="loginError" class="error"></div>
      </form>
    </div>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">🏠 FamilyFinance</div>

      <button class="nav-btn active" data-tab="dashboard" onclick="showTab('dashboard')">Dashboard</button>
      <button class="nav-btn" data-tab="expenses" onclick="showTab('expenses')">Expenses</button>
      <button class="nav-btn" data-tab="income" onclick="showTab('income')">Income</button>
      <button class="nav-btn" data-tab="bills" onclick="showTab('bills')">Bills</button>
      <button class="nav-btn" data-tab="budgets" onclick="showTab('budgets')">Budgets</button>
      <button class="nav-btn" data-tab="goals" onclick="showTab('goals')">Goals</button>
      <button class="nav-btn" data-tab="settings" onclick="showTab('settings')">Settings</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h2 id="pageTitle" style="margin: 0;">Dashboard</h2>
          <div class="muted" id="userLabel"></div>
        </div>
        <div>
          <button class="btn secondary" onclick="logout()">Logout</button>
        </div>
      </div>

      <section id="tab-dashboard">
        <div class="grid cols-4" id="dashboardStats"></div>

        <div class="section grid cols-2">
          <div class="card">
            <h3>Recent Expenses</h3>
            <div id="recentExpenses"></div>
          </div>

          <div class="card">
            <h3>Recent Income</h3>
            <div id="recentIncome"></div>
          </div>
        </div>
      </section>

      <section id="tab-expenses" class="hidden">
        <div class="card">
          <div class="toolbar">
            <h3 style="margin: 0;">Expenses</h3>
            <button class="btn" onclick="toggleForm('expenseForm')">+ Add Expense</button>
          </div>

          <form id="expenseForm" class="hidden" onsubmit="createExpense(event)">
            <div class="form-grid">
              <div>
                <label>Title</label>
                <input id="expenseTitle" required />
              </div>
              <div>
                <label>Category</label>
                <input id="expenseCategory" value="Other" required />
              </div>
              <div>
                <label>Amount</label>
                <input id="expenseAmount" type="number" step="0.01" min="0.01" required />
              </div>
              <div>
                <label>Date</label>
                <input id="expenseDate" type="date" required />
              </div>
              <div>
                <label>Store</label>
                <input id="expenseStore" />
              </div>
              <div>
                <label>Member</label>
                <input id="expenseMember" />
              </div>
              <div class="full">
                <label>Notes</label>
                <textarea id="expenseNotes"></textarea>
              </div>
            </div>
            <div style="margin-top: 14px;">
              <button class="btn" type="submit">Save Expense</button>
            </div>
          </form>

          <div id="expensesTable" style="margin-top: 16px;"></div>
        </div>
      </section>

      <section id="tab-income" class="hidden">
        <div class="card">
          <div class="toolbar">
            <h3 style="margin: 0;">Income</h3>
            <button class="btn" onclick="toggleForm('incomeForm')">+ Add Income</button>
          </div>

          <form id="incomeForm" class="hidden" onsubmit="createIncome(event)">
            <div class="form-grid">
              <div>
                <label>Title</label>
                <input id="incomeTitle" required />
              </div>
              <div>
                <label>Category</label>
                <input id="incomeCategory" value="Other" required />
              </div>
              <div>
                <label>Amount</label>
                <input id="incomeAmount" type="number" step="0.01" min="0.01" required />
              </div>
              <div>
                <label>Date</label>
                <input id="incomeDate" type="date" required />
              </div>
              <div>
                <label>Source</label>
                <input id="incomeSource" />
              </div>
              <div>
                <label>Member</label>
                <input id="incomeMember" />
              </div>
              <div class="full">
                <label>Notes</label>
                <textarea id="incomeNotes"></textarea>
              </div>
            </div>
            <div style="margin-top: 14px;">
              <button class="btn" type="submit">Save Income</button>
            </div>
          </form>

          <div id="incomeTable" style="margin-top: 16px;"></div>
        </div>
      </section>

      <section id="tab-bills" class="hidden">
        <div class="card">
          <div class="toolbar">
            <h3 style="margin: 0;">Bills</h3>
            <button class="btn" onclick="toggleForm('billForm')">+ Add Bill</button>
          </div>

          <form id="billForm" class="hidden" onsubmit="createBill(event)">
            <div class="form-grid">
              <div>
                <label>Payee Name</label>
                <input id="billPayee" required />
              </div>
              <div>
                <label>Category</label>
                <input id="billCategory" value="Other" required />
              </div>
              <div>
                <label>Bill Date</label>
                <input id="billDate" type="date" required />
              </div>
              <div>
                <label>Due Date</label>
                <input id="billDueDate" type="date" required />
              </div>
              <div>
                <label>Item Name</label>
                <input id="billItemName" required />
              </div>
              <div>
                <label>Quantity</label>
                <input id="billQuantity" type="number" step="0.0001" min="0.0001" value="1" required />
              </div>
              <div>
                <label>Unit Price</label>
                <input id="billUnitPrice" type="number" step="0.01" min="0" required />
              </div>
              <div>
                <label>Tax Rate %</label>
                <input id="billTaxRate" type="number" step="0.01" min="0" max="100" value="0" />
              </div>
              <div class="full">
                <label>Notes</label>
                <textarea id="billNotes"></textarea>
              </div>
            </div>
            <div style="margin-top: 14px;">
              <button class="btn" type="submit">Save Bill</button>
            </div>
          </form>

          <div id="billsTable" style="margin-top: 16px;"></div>
        </div>
      </section>

      <section id="tab-budgets" class="hidden">
        <div class="card">
          <div class="toolbar">
            <h3 style="margin: 0;">Budgets</h3>
            <button class="btn" onclick="toggleForm('budgetForm')">+ Add Budget</button>
          </div>

          <form id="budgetForm" class="hidden" onsubmit="createBudget(event)">
            <div class="form-grid">
              <div>
                <label>Category</label>
                <input id="budgetCategory" required />
              </div>
              <div>
                <label>Period</label>
                <select id="budgetPeriod">
                  <option value="monthly">Monthly</option>
                  <option value="yearly">Yearly</option>
                </select>
              </div>
              <div>
                <label>Amount</label>
                <input id="budgetAmount" type="number" step="0.01" min="0.01" required />
              </div>
              <div>
                <label>Member</label>
                <input id="budgetMember" />
              </div>
              <div class="full">
                <label>Notes</label>
                <textarea id="budgetNotes"></textarea>
              </div>
            </div>
            <div style="margin-top: 14px;">
              <button class="btn" type="submit">Save Budget</button>
            </div>
          </form>

          <div id="budgetsTable" style="margin-top: 16px;"></div>
        </div>
      </section>

      <section id="tab-goals" class="hidden">
        <div class="card">
          <div class="toolbar">
            <h3 style="margin: 0;">Goals</h3>
            <button class="btn" onclick="toggleForm('goalForm')">+ Add Goal</button>
          </div>

          <form id="goalForm" class="hidden" onsubmit="createGoal(event)">
            <div class="form-grid">
              <div>
                <label>Name</label>
                <input id="goalName" required />
              </div>
              <div>
                <label>Target Amount</label>
                <input id="goalTarget" type="number" step="0.01" min="0.01" required />
              </div>
              <div>
                <label>Current Amount</label>
                <input id="goalCurrent" type="number" step="0.01" min="0" value="0" />
              </div>
              <div>
                <label>Target Date</label>
                <input id="goalTargetDate" type="date" />
              </div>
              <div class="full">
                <label>Notes</label>
                <textarea id="goalNotes"></textarea>
              </div>
            </div>
            <div style="margin-top: 14px;">
              <button class="btn" type="submit">Save Goal</button>
            </div>
          </form>

          <div id="goalsTable" style="margin-top: 16px;"></div>
        </div>
      </section>

      <section id="tab-settings" class="hidden">
        <div class="card">
          <h3>Settings</h3>

          <form onsubmit="saveSettings(event)">
            <div class="form-grid">
              <div>
                <label>Family Name</label>
                <input id="settingsFamilyName" />
              </div>
              <div>
                <label>Primary Email</label>
                <input id="settingsEmail" type="email" />
              </div>
              <div>
                <label>Primary Phone</label>
                <input id="settingsPhone" />
              </div>
              <div>
                <label>Currency Symbol</label>
                <input id="settingsCurrencySymbol" />
              </div>
              <div>
                <label>Currency Code</label>
                <input id="settingsCurrencyCode" />
              </div>
              <div>
                <label>Bill Prefix</label>
                <input id="settingsBillPrefix" />
              </div>
              <div>
                <label>Monthly Income Goal</label>
                <input id="settingsMonthlyIncomeGoal" type="number" step="0.01" min="0" />
              </div>
              <div>
                <label>Savings Target %</label>
                <input id="settingsSavingsTargetPct" type="number" step="0.01" min="0" max="100" />
              </div>
              <div class="full">
                <label>Family Address</label>
                <textarea id="settingsFamilyAddress"></textarea>
              </div>
              <div class="full">
                <label>Family Notes</label>
                <textarea id="settingsFamilyNotes"></textarea>
              </div>
            </div>

            <div style="margin-top: 14px;">
              <button class="btn" type="submit">Save Settings</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script>
    let csrf = null;

    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function showLogin() {
      $("loginView").classList.remove("hidden");
      $("appView").classList.add("hidden");
    }

    function showApp() {
      $("loginView").classList.add("hidden");
      $("appView").classList.remove("hidden");
    }

    function showTab(name) {
      const titles = {
        dashboard: "Dashboard",
        expenses: "Expenses",
        income: "Income",
        bills: "Bills",
        budgets: "Budgets",
        goals: "Goals",
        settings: "Settings"
      };

      $("pageTitle").textContent = titles[name] || "Dashboard";

      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === name);
      });

      document.querySelectorAll("[id^='tab-']").forEach((section) => {
        section.classList.add("hidden");
      });

      $(`tab-${name}`).classList.remove("hidden");

      if (name === "dashboard") loadDashboard();
      if (name === "expenses") loadExpenses();
      if (name === "income") loadIncome();
      if (name === "bills") loadBills();
      if (name === "budgets") loadBudgets();
      if (name === "goals") loadGoals();
      if (name === "settings") loadSettings();
    }

    function toggleForm(id) {
      $(id).classList.toggle("hidden");
    }

    async function api(path, method = "GET", body = null) {
      const options = {
        method,
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "same-origin"
      };

      if (csrf && ["POST", "PUT", "PATCH", "DELETE"].includes(method)) {
        options.headers["X-CSRF-Token"] = csrf;
      }

      if (body) {
        options.body = JSON.stringify(body);
      }

      const res = await fetch(path, options);

      let data = null;
      try {
        data = await res.json();
      } catch (err) {
        data = {};
      }

      if (res.status === 401 && path !== "/api/auth/login") {
        showLogin();
        throw new Error("Authentication required");
      }

      if (!res.ok) {
        throw new Error(data.error || `Request failed with status ${res.status}`);
      }

      return data;
    }

    async function login(event) {
      event.preventDefault();
      $("loginError").textContent = "";

      try {
        const data = await api("/api/auth/login", "POST", {
          username: $("loginUsername").value,
          password: $("loginPassword").value
        });

        csrf = data.csrf_token;
        $("userLabel").textContent = `${data.user.username} • ${data.user.role}`;
        showApp();
        showTab("dashboard");
      } catch (err) {
        $("loginError").textContent = err.message;
      }
    }

    async function logout() {
      try {
        await api("/api/auth/logout", "POST");
      } catch (err) {
        // Ignore logout errors.
      }

      csrf = null;
      showLogin();
    }

    async function loadDashboard() {
      const data = await api("/api/dashboard");

      const stats = [
        ["Monthly Income", data.monthly_income],
        ["Monthly Spending", data.monthly_expenses],
        ["Monthly Savings", data.monthly_savings],
        ["Savings Rate", `${data.savings_rate}%`],
        ["Pending Bills", data.pending_bills],
        ["Overdue Bills", data.overdue_count],
        ["Annual Income", data.annual_income],
        ["Annual Spending", data.annual_expenses]
      ];

      $("dashboardStats").innerHTML = stats.map(([label, value]) => `
        <div class="card stat">
          <div class="label">${escapeHtml(label)}</div>
          <div class="value">${escapeHtml(value)}</div>
        </div>
      `).join("");

      $("recentExpenses").innerHTML = data.recent_expenses.length
        ? `
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th class="right">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${data.recent_expenses.map((item) => `
                <tr>
                  <td>${escapeHtml(item.title)}</td>
                  <td>${escapeHtml(item.category)}</td>
                  <td>${escapeHtml(item.expense_date)}</td>
                  <td class="right">${escapeHtml(item.amount)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `
        : `<p class="muted">No expenses yet.</p>`;

      $("recentIncome").innerHTML = data.recent_income.length
        ? `
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th class="right">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${data.recent_income.map((item) => `
                <tr>
                  <td>${escapeHtml(item.title)}</td>
                  <td>${escapeHtml(item.category)}</td>
                  <td>${escapeHtml(item.income_date)}</td>
                  <td class="right">${escapeHtml(item.amount)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `
        : `<p class="muted">No income yet.</p>`;
    }

    async function loadExpenses() {
      const data = await api("/api/expenses?limit=50");

      $("expensesTable").innerHTML = data.items.length
        ? `
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th>Member</th>
                <th class="right">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${data.items.map((item) => `
                <tr>
                  <td>${escapeHtml(item.title)}</td>
                  <td>${escapeHtml(item.category)}</td>
                  <td>${escapeHtml(item.expense_date)}</td>
                  <td>${escapeHtml(item.member || "")}</td>
                  <td class="right">${escapeHtml(item.amount)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `
        : `<p class="muted">No expenses found.</p>`;
    }

    async function createExpense(event) {
      event.preventDefault();

      await api("/api/expenses", "POST", {
        title: $("expenseTitle").value,
        category: $("expenseCategory").value,
        amount: $("expenseAmount").value,
        expense_date: $("expenseDate").value,
        store: $("expenseStore").value,
        member: $("expenseMember").value,
        notes: $("expenseNotes").value
      });

      $("expenseForm").reset();
      $("expenseForm").classList.add("hidden");
      await loadExpenses();
    }

    async function loadIncome() {
      const data = await api("/api/income?limit=50");

      $("incomeTable").innerHTML = data.items.length
        ? `
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th>Member</th>
                <th class="right">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${data.items.map((item) => `
                <tr>
                  <td>${escapeHtml(item.title)}</td>
                  <td>${escapeHtml(item.category)}</td>
                  <td>${escapeHtml(item.income_date)}</td>
                  <td>${escapeHtml(item.member || "")}</td>
                  <td class="right">${escapeHtml(item.amount)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `
        : `<p class="muted">No income found.</p>`;
    }

    async function createIncome(event) {
      event.preventDefault();

      await api("/api/income", "POST", {
        title: $("incomeTitle").value,
        category: $("incomeCategory").value,
        amount: $("incomeAmount").value,
        income_date: $("incomeDate").value,
        source: $("incomeSource").value,
        member: $("incomeMember").value,
        notes: $("incomeNotes").value
      });

      $("incomeForm").reset();
      $("incomeForm").classList.add("hidden");
      await loadIncome();
    }

    function billPill(status) {
      const value = status || "";
      let className = "";

      if (value === "Paid") className = "success";
      if (value === "Pending" || value === "Partially Paid") className = "warning";
      if (value === "Void") className = "danger";

      return `<span class="pill ${className}">${escapeHtml(value)}</span>`;
    }

    async function loadBills() {
      const data = await api("/api/bills?limit=50");

      $("billsTable").innerHTML = data.items.length
        ? `
          <table>
            <thead>
              <tr>
                <th>Bill #</th>
                <th>Payee</th>
                <th>Category</th>
                <th>Due Date</th>
                <th class="right">Total</th>
                <th class="right">Paid</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${data.items.map((item) => `
                <tr>
                  <td>${escapeHtml(item.bill_number)}</td>
                  <td>${escapeHtml(item.payee_name)}</td>
                  <td>${escapeHtml(item.bill_category)}</td>
                  <td>${escapeHtml(item.due_date)}</td>
                  <td class="right">${escapeHtml(item.total_amount)}</td>
                  <td class="right">${escapeHtml(item.paid_amount)}</td>
                  <td>${billPill(item.display_status || item.status)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `
        : `<p class="muted">No bills found.</p>`;
    }

    async function createBill(event) {
      event.preventDefault();

      await api("/api/bills", "POST", {
        payee_name: $("billPayee").value,
        bill_category: $("billCategory").value,
        bill_date: $("billDate").value,
        due_date: $("billDueDate").value,
        tax_rate: $("billTaxRate").value || "0",
        notes: $("billNotes").value,
        items: [
          {
            item_name: $("billItemName").value,
            quantity: $("billQuantity").value,
            unit_price: $("billUnitPrice").value
          }
        ]
      });

      $("billForm").reset();
      $("billForm").classList.add("hidden");
      await loadBills();
    }

    async function loadBudgets() {
      const data = await api("/api/budgets");

      $("budgetsTable").innerHTML = data.length
        ? `
          <table>
            <thead>
              <tr>
                <th>Category</th>
                <th>Period</th>
                <th>Member</th>
                <th class="right">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${data.map((item) => `
                <tr>
                  <td>${escapeHtml(item.category)}</td>
                  <td>${escapeHtml(item.period)}</td>
                  <td>${escapeHtml(item.member || "")}</td>
                  <td class="right">${escapeHtml(item.amount)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `
        : `<p class="muted">No budgets found.</p>`;
    }

    async function createBudget(event) {
      event.preventDefault();

      await api("/api/budgets", "POST", {
        category: $("budgetCategory").value,
        period: $("budgetPeriod").value,
        amount: $("budgetAmount").value,
        member: $("budgetMember").value,
        notes: $("budgetNotes").value
      });

      $("budgetForm").reset();
      $("budgetForm").classList.add("hidden");
      await loadBudgets();
    }

    async function loadGoals() {
      const data = await api("/api/goals");

      $("goalsTable").innerHTML = data.length
        ? `
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Target Date</th>
                <th class="right">Target</th>
                <th class="right">Current</th>
                <th class="right">Progress</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${data.map((item) => `
                <tr>
                  <td>${escapeHtml(item.name)}</td>
                  <td>${escapeHtml(item.target_date || "")}</td>
                  <td class="right">${escapeHtml(item.target)}</td>
                  <td class="right">${escapeHtml(item.current)}</td>
                  <td class="right">${escapeHtml(item.progress_pct)}%</td>
                  <td>
                    <button class="btn small" onclick="contributeGoal(${item.id})">Contribute</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `
        : `<p class="muted">No goals found.</p>`;
    }

    async function createGoal(event) {
      event.preventDefault();

      await api("/api/goals", "POST", {
        name: $("goalName").value,
        target: $("goalTarget").value,
        current: $("goalCurrent").value,
        target_date: $("goalTargetDate").value || null,
        notes: $("goalNotes").value
      });

      $("goalForm").reset();
      $("goalForm").classList.add("hidden");
      await loadGoals();
    }

    async function contributeGoal(goalId) {
      const amount = prompt("Contribution amount:");

      if (!amount) {
        return;
      }

      await api(`/api/goals/${goalId}/contribute`, "POST", {
        amount
      });

      await loadGoals();
    }

    async function loadSettings() {
      const data = await api("/api/settings");

      $("settingsFamilyName").value = data.family_name || "";
      $("settingsEmail").value = data.primary_email || "";
      $("settingsPhone").value = data.primary_phone || "";
      $("settingsCurrencySymbol").value = data.currency_symbol || "";
      $("settingsCurrencyCode").value = data.currency_code || "";
      $("settingsBillPrefix").value = data.bill_prefix || "";
      $("settingsMonthlyIncomeGoal").value = data.monthly_income_goal || "";
      $("settingsSavingsTargetPct").value = data.savings_target_pct || "";
      $("settingsFamilyAddress").value = data.family_address || "";
      $("settingsFamilyNotes").value = data.family_notes || "";
    }

    async function saveSettings(event) {
      event.preventDefault();

      await api("/api/settings", "POST", {
        family_name: $("settingsFamilyName").value,
        primary_email: $("settingsEmail").value,
        primary_phone: $("settingsPhone").value,
        currency_symbol: $("settingsCurrencySymbol").value,
        currency_code: $("settingsCurrencyCode").value,
        bill_prefix: $("settingsBillPrefix").value,
        monthly_income_goal: $("settingsMonthlyIncomeGoal").value,
        savings_target_pct: $("settingsSavingsTargetPct").value,
        family_address: $("settingsFamilyAddress").value,
        family_notes: $("settingsFamilyNotes").value
      });

      alert("Settings saved.");
    }

    async function bootstrap() {
      try {
        const data = await api("/api/me");
        csrf = data.csrf_token;
        $("userLabel").textContent = `${data.user.username} • ${data.user.role}`;
        showApp();
        showTab("dashboard");
      } catch (err) {
        showLogin();
      }
    }

    $("loginForm").addEventListener("submit", login);
    bootstrap();
  </script>
</body>
</html>
